[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lob-backtester"
version = "0.1.0"
description = "Standalone backtesting library for LOB prediction models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [
    {name = "HFT Pipeline Team"}
]
keywords = ["backtesting", "trading", "machine-learning", "limit-order-book"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # #PY-73 atomic-write SSoT (2026-05-11): pinned >=2.7.0 after
    # hft-contracts v2.7.0 added `atomic_write_npy` to
    # `hft_contracts.atomic_io`. Backtester consumes from registry.py:120
    # (equity_curve.npy persistence — protects against SIGKILL-mid-write
    # corruption that downstream analytics would silently consume).
    "hft-contracts>=2.7.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    # T1-1 (2026-05-22): scipy is consumed by
    # `scripts/run_spread_signal_backtest.py:27` (`scipy.stats.norm` — BSM
    # deep-ITM theta correction). HG-1 (2026-05-29): the former
    # `lobbacktest.metrics.regression_prediction` consumer was DELETED as
    # orphan dead code (0 consumers; IC/MSE/Correlation duplicated upstream in
    # hft_metrics.ic / hft_metrics.regression per hft-rules §0 reuse-first), so
    # only the run_spread_signal_backtest.py norm consumer now justifies the
    # pin. Cross-repo consistency: hft-metrics + lob-model-trainer +
    # hft-feature-evaluator all pin scipy>=1.10. Closes CI ModuleNotFoundError
    # red streak since 2026-05-11 (18 consecutive runs).
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]
torch = [
    "torch>=2.0.0",
]

[project.urls]
Documentation = "https://github.com/nagarx/HFT-pipeline-v2/tree/main/lob-backtester"
Repository = "https://github.com/nagarx/HFT-pipeline-v2"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
strict = false

